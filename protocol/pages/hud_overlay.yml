name: hud_overlay
# A persistent overlay rather than a screen: no backdrop, nothing centred, and every
# element pinned to an edge.
#
# `align` is what makes that work on a monitor that is not 16:9. The design space is a
# fixed 1920x1080 that hud.glsl scales to the player's real resolution, and on an ultrawide
# the extra width appears at the sides, so an element authored at x=1900 is not at the
# right edge, it is 20 units left of where 1920 landed. `align: right` anchors it to the
# actual screen edge instead. A full-screen page never notices; a HUD notices immediately.
screen:
  width: 1920
  height: 1080
  # Nothing here is clickable, so the cursor stays out of it entirely.
  cursorSize: 0
  cursorSpeed: 2.0
  cursorLayer: 9700

# Live values. `%name%` is substituted on a timer and only re-sent when it changes, which
# is what makes a HUD affordable: a clock that re-rendered every tick would re-send every
# element twenty times a second and starve the cursor.
blocks:
  # ---- top left: who and where ----------------------------------------------------------
  - type: block_rounded
    id: identity
    layer: 10.0
    color: 0d0d12
    opacity: 190
    align: left
    position: {x: 24, y: 24}
    size: {width: 260, height: 68}
    rounding: {size: small}
    outline: {size: 1, color: 24242e}

    children:
      - type: text
        id: identity_name
        layer: 11.0
        color: f2f2f7
        position: {x: 18, y: 14}
        size: {width: 58, height: 58}
        text: "%shadr_player%"
        font: shadr_semibold
        textAlign: left

      - type: text
        id: identity_where
        layer: 11.0
        color: 7d7d8c
        position: {x: 18, y: 40}
        size: {width: 44, height: 44}
        text: "%shadr_world%  ·  %shadr_time%"
        textAlign: left

  # ---- top right: server state ----------------------------------------------------------
  - type: grid_block
    id: hud_stats
    direction: column
    gap: 8
    align: right
    position: {x: 1920 - 200, y: 24}
    children:
      - type: component
        component: badge
        params: {id: hud_tps, label: "%shadr_tps% TPS", width: 118, color: "70e000"}
      - type: component
        component: badge
        params: {id: hud_ping, label: "%shadr_ping% ms", width: 118, color: "4cc9f0", textColor: "08080b"}

  # ---- bottom left: bars ----------------------------------------------------------------
  - type: component
    component: section_header
    params: {id: xp_header, label: "%shadr_online% / %shadr_max_players% ONLINE", color: "9a9aa8"}
    align: left
    position: {x: 24, y: 1080 - 108}

  # A live fraction. `progress_bar` computes `width * value`, so passing a placeholder-bearing
  # value composes into `300 * %shadr_online% / %shadr_max_players%`, an ordinary expression
  # that happens to contain placeholders, re-evaluated on the same tick that refreshes text.
  # No change to the component was needed for this, which is the point of not inventing a
  # separate binding syntax.
  - type: component
    component: progress_bar
    params:
      id: xp_bar
      width: 300
      height: 8
      value: "%shadr_online% / %shadr_max_players%"
      color: "70e000"
    align: left
    position: {x: 24, y: 1080 - 82}

  - type: component
    component: progress_bar
    params: {id: mana_bar, width: 300, height: 8, value: 0.75, color: "4cc9f0"}
    align: left
    position: {x: 24, y: 1080 - 62}

  # ---- centre: a transient notice -------------------------------------------------------
  #
  # Left in the page rather than spawned on demand, because this file is also the worked
  # example for `toast`; a live server would open a page carrying one and close it again.
  - type: component
    component: toast
    params:
      id: hud_toast
      title: "Quest complete"
      body: "Return to the village elder."
      accent: "f0a04c"
    position: {x: 1920/2 - 190, y: 96}

animations:
  # A HUD's animation is the one that has to be cheap: it runs for everyone, all the time.
  # A two-point ramp on a transform axis compiles to display-entity interpolation metadata
  # and is tweened by the client, so this costs nothing per tick on the server.
  - name: open
    durationTicks: 10
    steps:
      - target: hud_toast
        axis: y
        easing: smooth-out
        from: 40
        to: 96
        duration: 10
      - target: identity
        axis: x
        easing: ease-out
        from: -40
        to: 24
        duration: 8
