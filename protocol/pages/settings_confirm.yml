name: settings_confirm
# The dialog `settings.yml` opens. A page of its own, not a hidden branch inside it,
# because the page format has no conditionals: "shown" and "not shown" are two pages, and
# `open:` composes them without closing the one underneath.
screen:
  width: 1920
  height: 1080
  cursorSize: 10
  cursorSpeed: 2.0
  cursorLayer: 9700

blocks:
  - type: component
    component: modal
    params:
      id: reset_modal
      title: "Reset all settings?"
      body: "Every value on this screen goes back to its default. This cannot be undone."
      confirmLabel: "Reset"
      cancelLabel: "Keep"
      accent: "c05050"
    position: {x: 0, y: 0}
