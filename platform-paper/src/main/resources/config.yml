resource-pack:
  # Send the generated pack when a player joins. Without the pack the client has no
  # shadr font and no HUD shaders, so pages render as missing glyphs in world space.
  apply-on-join: true
  kick-on-decline: false
  kick-on-fail: false
  compress-images: true

  # Blank the vanilla HUD sprites (hearts, hotbar, food, armor, xp, locator bar).
  # There is no packet to hide the HUD, so the sprites are replaced with a
  # transparent pixel, so vanilla still draws it, into nothing.
  remove-default-hotbar: false

  hosting:
    # shadr hosts the pack itself on the server's own address.
    default-pack:
      enabled: true
    # Same, but with an explicitly advertised address; use behind a proxy or NAT.
    self-host:
      enabled: false
      server-ip: '127.0.0.1'
      pack-port: 8123
    # The pack is already published somewhere; shadr only sends URL + hash.
    external-host:
      enabled: false
      url: ''
    # Build the pack but never send one. Another plugin owns what the player
    # downloads; shadr contributes its files and stays out of the way. Read the
    # generated tree through ShadrApi, or have it copied for you with merge-into.
    merge-only:
      enabled: false
      # Copy the generated files over this pack after every build. Relative paths
      # resolve against the shadr data folder. Files shadr did not generate are left
      # alone, so the other pack keeps its own content.
      merge-into: ''
    # You merge shadr's generated assets into your own pack; shadr sends nothing.
    external-pack:
      enabled: false

  messages:
    chat:
      enabled: false
    title:
      enabled: true
    sound:
      enabled: true
      volume: 1.0

rendering:
  fix-shaders: false
  fix-shaders-y-offset: 2.1006
  fix-shaders-forward-offset: 0.3781
  fix-shaders-layer-gap: 0.000002
  hud-scale-divisor: 1000.0
  packet-entities: true

editor:
  placeholders:
    text-refresh: 20
  autosave:
    enabled: true
    interval-seconds: 600
  history:
    undo-limit: 50
  max-page-elements: 500
  sounds:
    enabled: true
    volume: 1.0

  web:
    enabled: false
    port: 8124
    # Loopback
    bind: '127.0.0.1'
    # Blank generates one on first start.
    token: ''
    # Run with no authentication at all.
    allow-insecure: false
    public-host: ''
    ui-dir: 'editor-web'
    tls-keystore: ''
    tls-password: ''
    tls-key-password: ''

updates:
  check: true

  download: false

  notify-ops: true
  interval-hours: 6

  # auto
  # stable
  # prerelease
  channel: auto

  repository: 'theDevJade/shadr'

  signing-key: ''

experimental:
  mouse-prediction: true
