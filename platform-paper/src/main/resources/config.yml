resource-pack:
  # Send the generated pack when a player joins.
  apply-on-join: true
  kick-on-decline: false
  kick-on-fail: false
  compress-images: true

  # Blank the vanilla HUD sprites
  remove-default-hotbar: false

  hosting:
    # shadr hosts the pack itself on the server's own address.
    default-pack:
      enabled: true
    # Same, but with an explicit address
    self-host:
      enabled: false
      server-ip: '127.0.0.1'
      pack-port: 8123
    # The pack is already published somewhere
    external-host:
      enabled: false
      url: ''
    merge-only:
      enabled: false
      merge-into: ''
    external-pack:
      enabled: false

  messages:
    chat:
      enabled: false
    title:
      enabled: true
    sound:
      enabled: true
      volume: 1.0

rendering:
  fix-shaders: false
  fix-shaders-y-offset: 2.1006
  fix-shaders-forward-offset: 0.3781
  fix-shaders-layer-gap: 0.000002
  hud-scale-divisor: 1000.0
  packet-entities: true

editor:
  placeholders:
    text-refresh: 20
  autosave:
    enabled: true
    interval-seconds: 600
  history:
    undo-limit: 50
  max-page-elements: 500
  sounds:
    enabled: true
    volume: 1.0

  web:
    enabled: false
    port: 8124
    # Loopback
    bind: '127.0.0.1'
    # Blank generates one on first start.
    token: ''
    # Run with no authentication at all.
    allow-insecure: false
    public-host: ''
    ui-dir: 'editor-web'
    tls-keystore: ''
    tls-password: ''
    tls-key-password: ''

updates:
  check: true

  download: false

  notify-ops: true
  interval-hours: 6

  # auto
  # stable
  # prerelease
  channel: auto

  repository: 'theDevJade/shadr'

  signing-key: ''

experimental:
  mouse-prediction: true

# Server-streamed video using the map.
stream:
  enabled: false

  # quality: ~16 slots, ~224 KiB working set, roughly 1 MB/s per viewer
  # broadcast: 4 slots at a lower rate
  profile: quality
  slots: 0
  region-x: 0
  region-y: 0
  map-id-base: 32000
  fps: 0
  probe: false
