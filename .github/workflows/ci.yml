name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Generate the resource pack
        run: >
          ./gradlew :resourcepack:run
          --no-daemon
          --args="$PWD/shaders $PWD/out/pack $PWD/assets/font $PWD/assets/shadr/sounds"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-jar
          path: platform-paper/build/libs/*.jar
          if-no-files-found: warn

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the jars the integrations compile against
        run: ./gradlew :core:jar :platform-paper:jar --no-daemon

      - name: Skript
        run: ./gradlew build --no-daemon
        working-directory: integrations/skript

      - name: Typewriter
        run: ./gradlew build --no-daemon
        working-directory: integrations/typewriter

  paper-nms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: platform-paper-nms
        run: ./gradlew build --no-daemon
        working-directory: platform-paper-nms

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-nms-jar
          path: platform-paper-nms/build/libs/*.jar
          if-no-files-found: warn

  minestom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build core
        run: ./gradlew :core:jar --no-daemon

      - name: platform-minestom
        run: ./gradlew build --no-daemon
        working-directory: platform-minestom

      - name: testserver
        run: ./gradlew build --no-daemon
        working-directory: testserver

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Sync fonts
        run: ./scripts/sync-editor-fonts.sh

      - name: Analyze
        run: flutter analyze
        working-directory: editor

      - name: Test
        run: flutter test
        working-directory: editor
