name: artifacts

on:
  workflow_dispatch:
    inputs:
      run-tests:
        description: Run tests and spotless too, not just assemble the artifacts
        type: boolean
        default: true
      retention-days:
        description: How long to keep the uploaded artifacts
        type: string
        default: '14'

permissions:
  contents: read

env:
  GRADLE_TASK: ${{ inputs.run-tests && 'build' || 'assemble' }}

jobs:
  core:
    name: core, paper, resource pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Sync fonts
        run: ./scripts/sync-editor-fonts.sh

      - name: Build the editor UI the jar embeds
        run: flutter build web --release
        working-directory: editor

      - name: Build
        run: ./gradlew ${{ env.GRADLE_TASK }} --no-daemon

      - name: Generate the resource pack
        run: >
          ./gradlew :resourcepack:run
          --no-daemon
          --args="$PWD/shaders $PWD/out/pack $PWD/assets/font $PWD/assets/shadr/sounds"

      - name: Upload the Paper plugin
        uses: actions/upload-artifact@v4
        with:
          name: shadr-paper
          path: platform-paper/build/libs/*.jar
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload the library jars
        uses: actions/upload-artifact@v4
        with:
          name: shadr-libraries
          path: |
            core/build/libs/*.jar
            resourcepack/build/libs/*.jar
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload the resource pack
        uses: actions/upload-artifact@v4
        with:
          name: shadr-resource-pack
          path: out/shadr-pack.zip
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  paper-nms:
    name: paper NMS backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew ${{ env.GRADLE_TASK }} --no-daemon
        working-directory: platform-paper-nms

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: shadr-paper-nms
          path: platform-paper-nms/*/build/libs/*.jar
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  minestom:
    name: minestom adapter and test server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the jars minestom and testserver consume
        run: ./gradlew :core:jar :resourcepack:jar --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: platform-minestom
        run: ./gradlew ${{ env.GRADLE_TASK }} --no-daemon
        working-directory: platform-minestom
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}

      - name: testserver
        run: ./gradlew ${{ env.GRADLE_TASK }} --no-daemon
        working-directory: testserver
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: shadr-minestom
          path: |
            platform-minestom/build/libs/*.jar
            testserver/build/libs/*.jar
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  integrations:
    name: skript and typewriter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the jars the integrations compile against
        run: ./gradlew :core:jar :platform-paper:jar --no-daemon

      - name: Skript
        run: ./gradlew ${{ env.GRADLE_TASK }} --no-daemon
        working-directory: integrations/skript

      - name: Typewriter
        run: ./gradlew ${{ env.GRADLE_TASK }} --no-daemon
        working-directory: integrations/typewriter

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: shadr-integrations
          path: |
            integrations/skript/build/libs/*.jar
            integrations/typewriter/build/libs/*.jar
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  editor:
    name: editor web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Sync fonts
        run: ./scripts/sync-editor-fonts.sh

      - name: Analyze
        if: ${{ inputs.run-tests }}
        run: flutter analyze
        working-directory: editor

      - name: Test
        if: ${{ inputs.run-tests }}
        run: flutter test
        working-directory: editor

      - name: Build
        run: flutter build web --release
        working-directory: editor

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: shadr-editor-web
          path: editor/build/web
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
